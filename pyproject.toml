[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlblack"
version = "0.1.0"
description = "Optimization-first ML prototype aligned with nsgablack architecture."
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
torch = ["torch>=2.0"]
xgboost = ["xgboost>=1.7"]
transformers = ["transformers>=4.40"]
qlora = ["transformers>=4.40", "bitsandbytes>=0.43"]
all = ["scikit-learn>=1.3", "torch>=2.0", "xgboost>=1.7", "transformers>=4.40", "bitsandbytes>=0.43"]

[tool.pytest.ini_options]
pythonpath = [".."]

