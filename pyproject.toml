[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlblack"
version = "0.2.0"
description = "Optimization-first ML prototype aligned with nsgablack architecture."
requires-python = ">=3.10"
dependencies = [
    "blackbase>=0.3.0,<0.4.0",
    "numpy>=1.23",
]

[project.scripts]
mlblack = "mlblack.cli:main"
mlblack-webui = "mlblack.catalog.webui:main"

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
torch = ["torch>=2.0"]
xgboost = ["xgboost>=1.7"]
transformers = ["transformers>=4.40"]
qlora = ["transformers>=4.40", "bitsandbytes>=0.43"]
postgres = ["psycopg[binary]>=3.1"]
time_series = ["statsmodels>=0.14"]
web = ["streamlit>=1.32"]
all = ["scikit-learn>=1.3", "torch>=2.0", "xgboost>=1.7", "transformers>=4.40", "bitsandbytes>=0.43", "psycopg[binary]>=3.1", "statsmodels>=0.14", "streamlit>=1.32"]

[tool.setuptools]
package-dir = { "mlblack" = "." }
packages = [
    "mlblack",
    "mlblack.adapters",
    "mlblack.assembly",
    "mlblack.assembly.config",
    "mlblack.assembly.schema",
    "mlblack.backends",
    "mlblack.backends.jax_neural",
    "mlblack.backends.jax_neural.capabilities",
    "mlblack.backends.numpy_neural",
    "mlblack.backends.numpy_neural.capabilities",
    "mlblack.backends.tensorflow_neural",
    "mlblack.backends.tensorflow_neural.capabilities",
    "mlblack.backends.torch_neural",
    "mlblack.backends.torch_neural.capabilities",
    "mlblack.bias",
    "mlblack.capabilities",
    "mlblack.catalog",
    "mlblack.catalog.experiment",
    "mlblack.catalog.store",
    "mlblack.core",
    "mlblack.integrations",
    "mlblack.integrations.nsgablack_neural",
    "mlblack.integrations.nsgablack_symbolic",
    "mlblack.models",
    "mlblack.pipeline",
    "mlblack.pipeline.conditional",
    "mlblack.pipeline.data_views",
    "mlblack.pipeline.numericizer",
    "mlblack.pipeline.symbolic",
    "mlblack.presets",
    "mlblack.problems",
    "mlblack.problems.training",
    "mlblack.project",
    "mlblack.project.scaffold",
    "mlblack.project.scaffold.solver_case_template",
    "mlblack.project.scaffold.solver_case_template.pipeline",
    "mlblack.project.scaffold.solver_case_template.problem",
    "mlblack.project.scaffold.trainer_case_template",
    "mlblack.project.scaffold.trainer_case_template.pipeline",
    "mlblack.project.scaffold.trainer_case_template.problem",
    "mlblack.representations",
    "mlblack.representations.codecs",
    "mlblack.representations.codecs.neural",
    "mlblack.representations.heads",
]

[tool.setuptools.package-data]
"mlblack.catalog" = ["entries/*.toml"]
"mlblack.project.scaffold.solver_case_template" = ["*.template"]
"mlblack.project.scaffold.trainer_case_template" = ["*.template"]
"mlblack.project.scaffold.trainer_case_template.pipeline" = ["*.template", "operators/.gitkeep"]

[tool.pytest.ini_options]
pythonpath = [".."]

