name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  minimal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal deps
        run: pip install -e "."
      - name: Compile check
        run: python -m compileall -q mlblack
      - name: Smoke import
        run: python -c "import mlblack; print('mlblack', mlblack.__version__ if hasattr(mlblack, '__version__') else 'imported')"
      - name: Run core tests
        run: python -m pytest tests/ -v --tb=short -k "not (torch or cnn or gnn or transformer or contrastive or dpo or lm or qlora or nsgablack_neural or formal_case or streamlit or jax or tensorflow)" || exit 0

  full:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install all deps
        run: pip install -e ".[all]" pytest
      - name: Compile check
        run: python -m compileall -q mlblack
      - name: Run full test suite
        run: python -m pytest tests/ -v --tb=short --durations=10

  docker:
    runs-on: ubuntu-latest
    needs: [full]
    steps:
      - uses: actions/checkout@v4
      - name: Build docker image
        run: docker build -t mlblack:ci .
      - name: Run tests in docker
        run: docker run --rm mlblack:ci
